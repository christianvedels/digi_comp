# What is an Algorithm?

# An Algorithm is Just a Recipe

.pull-left[
### Making Coffee (Human Algorithm)

1. Boil water
2. Put coffee in filter
3. **If** using milk: get milk from fridge
4. Pour water over coffee
5. Wait 4 minutes
6. Pour into cup
7. **If** using milk: add milk
8. Done

]

--

.pull-right[
### Key Insight

&gt; An **algorithm** is a sequence of steps to solve a problem.

- Clear instructions
- Defined order
- Decisions along the way (*if this, then that*)

**Computers just follow recipes very fast.**

]

--

.pull-left-wide[
*Sidenote: Many AI systems follow rules with if-then statements with uncertainty - more about that later*
]

???

- Walk through the coffee recipe step by step; point out that step 3 and 7 are already if-then logic — the concept is not new, just formalised.
- Stress that computers are completely literal: they follow the recipe exactly as written, with no common sense or context — that is both their power and their limitation.

*~3 min*

- Most popular language for data analysis
- Readable syntax (almost like English)

# The Basics: Variables

.pull-left-wide[
&gt; A **variable** is a named container that stores information.

```python
# Storing different types of information
country = "Denmark"           # Text (string)
population = 5900000          # Number (integer)
unemployment_rate = 4.8       # Decimal number (float)
is_eu_member = True           # True/False (boolean)
```
]

--

.pull-left-wide[
### Think of it like a spreadsheet cell with a name

| Variable Name | Value |
|---------------|-------|
| country | "Denmark" |
| population | 5900000 |
| unemployment_rate | 4.8 |
| is_eu_member | True |
]

???

- Lean heavily on the spreadsheet analogy — everyone in the room has used Excel, and a named cell is exactly what a variable is.
- Ask what variables students might use in their own field: a lawyer might have `case_status`, an economist `gdp_growth_rate` — making it personal makes it stick.

*~4 min*

# Doing Things With Variables

.pull-left-wide[
```python
# Math works as you'd expect
gdp = 400000000000          # 400 billion
population = 5900000

gdp_per_capita = gdp / population
print(gdp_per_capita)
```
**Output:** `67796.61...`
]

--

.pull-left-wide[
```python
# Combining text
first_name = "Margrethe"
title = "Queen"

full_title = title + " " + first_name
print(full_title)
```
**Output:** `Queen Margrethe`
]

???

- The GDP per capita calculation should feel immediately familiar to economics and social science students — point out this is precisely how such statistics are computed in practice.
- Note that `+` means different things for numbers (addition) and text (joining) — computers are literal about types, which is a source of many real bugs.

# If-Then-Else Logic
## Making Decisions in Code

???

- Frame this as the most important concept of the entire lecture — if-then logic is the backbone of everything from tax software to recommendation engines.
- Tell students to pay close attention to the symbol table coming up — confusing `=` and `==` is one of the most common beginner mistakes.

*~30 sec*

---
# The Structure of Decisions

.pull-left[
### In everyday language:

**If** it's raining, **then** bring umbrella.

**Otherwise**, leave it at home.

]

.pull-right[
### In Python:

```python
weather = "raining"

if weather == "raining":
    print("Bring umbrella")
else:
    print("Leave umbrella at home")
```
]

--

.small123[
.center[
| Symbol | Meaning |
|--------|---------|
| `=` | Assign a value |
| `==` | Check if equal |
| `!=` | Check if NOT equal |
| `&gt;` `&lt;` | Greater than / Less than |
| `&gt;=` `&lt;=` | Greater or equal / Less or equal |
]
]

???

- Start with the everyday language version and confirm that everyone already uses if-then logic dozens of times a day — the code version is just a formalisation.
- Spend time on the symbol table: `=` assigns, `==` compares — this single distinction trips up beginners consistently and is worth drilling with an example.

*~4 min*

---
# Example: Classifying Survey Responses

.pull-left-wide[
A common task in social science: categorize responses.

```python
# Survey question: "On a scale 0-10, how satisfied are you with the government?"
score = 7

if score &lt;= 5:
    print("Low satisfaction")
else:
    print("High satisfaction")
```

**Output:** `High satisfaction`
]

???

- Connect this directly to survey research students may have done or studied — this is exactly how automated coding of Likert-scale responses works at scale.
- Ask: "What if you wanted three categories instead of two?" — prime them for the `elif` concept on the next slide.

*~2 min*

---
# Example: Determine Tax Bracket

.pull-left-wide[
```python
income = 450000  # DKK per year

if income &lt;= 46700:
    bracket = "No income tax"
elif income &lt;= 544800:
    bracket = "Bottom bracket only"
else:
    bracket = "Bottom + Top bracket"

print("Tax situation:", bracket)
```

**Output:** `Tax situation: Bottom + Top bracket`
]

--

.pull-left-wide[
.small123[
*Simplified for illustration — real Danish tax is more complex!*
]
]

???

- The Danish tax example makes it immediately real — most students know about the top bracket and will recognise the thresholds as plausible.
- Emphasise that the *order* of conditions in an `elif` chain matters: Python checks from top to bottom and stops at the first true condition — swapping the order can silently produce wrong results.

*~3 min*

---
# Example: Pass or Fail?

.pull-left-wide[
```python
grade = 4   # Danish 7-point scale

if grade &gt;= 2:
    result = "Passed"
else:
    result = "Failed"

print("Exam result:", result)
```

**Output:** `Exam result: Passed`
]

???

- A familiar context — ask if any student has wondered how a learning management system automatically marks pass/fail at exam time; this is it.
- Keep this brief; it is a simple reinforcement of the if-else pattern before adding the complexity of `elif` and multiple conditions.

*~2 min*

---
# Multiple Conditions

.pull-left-wide[
You can combine conditions with `and` / `or`:

```python
age = 25
income = 300000

# Must be under 30 AND earn less than 350000 for youth benefit
if age &lt; 30 and income &lt; 350000:
    print("Eligible for youth housing benefit")
else:
    print("Not eligible")
```

**Output:** `Eligible for youth housing benefit`
]

--

.pull-left-wide[
```python
# Eligible if student OR unemployed
is_student = True
is_unemployed = False

if is_student or is_unemployed:
    print("Reduced price ticket")
```
]

???

- The housing benefit example is politically resonant — ask if students have encountered eligibility rules like this in Danish social policy, where multiple criteria must hold simultaneously.
- Clarify `and` vs `or` carefully with a plain-English sentence for each: `and` = both must be true; `or` = at least one must be true — this distinction is where the most confusion arises.

*~3 min*

**Q2.** You want to flag responses where satisfaction is low (≤ 3) **or** the respondent is under 25. Which condition is correct?

- **B)** `if score &lt;= 3 or age &lt; 25:` — *either condition is enough*

# Using If-Then to Make Predictions

???

- Announce the conceptual leap: we move from writing rules we design ourselves to using rules to *predict* outcomes from data.
- Tell students this section is the bridge to machine learning — what they learn here is the manual version of what ML automates.

*~30 sec*

# If-Then Can Make Predictions

.pull-left[
### Imagine you have this data:

.small123[
| Person | Age | Income | Education | Voted |
|--------|-----|--------|-----------|-------|
| Anna | 34 | 420000 | Bachelor | Yes |
| Mads | 28 | 310000 | Master | No |
| Signe | 45 | 580000 | PhD | Yes |
| Lars | 22 | 180000 | High School | No |
]

You notice a pattern: *higher income seems to predict voting.*
]

--

.pull-right[
### You write a prediction rule:

```python
income = 450000  # New person

if income &gt; 350000:
    prediction = "Will vote"
else:
    prediction = "Won't vote"

print(prediction)
```

**Output:** `Will vote`

This is a **prediction** based on data!
]

???

- Point out that this dataset is deliberately tiny — in reality we might have thousands of people and dozens of columns, which is why manual rule-writing becomes impractical.
- Emphasise the key idea: the same if-then syntax becomes a *prediction* when we apply it to a new person who was not in the original data.

*~4 min*

# Some Terminology

.pull-left[
### Features (Input)
The information we **use** to make predictions.

- Age
- Income
- Education

*Also called: predictors, independent variables, X*
]

.pull-right[
### Label (Output)
What we want to **predict**.

- Voted (Yes/No)

*Also called: target, outcome, dependent variable, y*
]

--

&lt;br&gt;

.center[
| | |
|---|---|
| **Features** | The columns we use as input |
| **Label** | The column we try to predict |
]

???

- These terms (features, labels) appear in every ML tutorial and paper — worth spending a moment so students are not confused when they encounter them outside this course.
- Ask students to translate to their own field: what would features and label look like in a legal case outcome model, or an economic growth forecast?

*~3 min*

# Data in Tables

.pull-left-wide[
.center[
| Person | Age | Income | Education | Voted |
|--------|-----|--------|-----------|-------|
| Anna | 34 | 420000 | Bachelor | Yes |
| Mads | 28 | 310000 | Master | No |

]

- This is the bridge between the spreadsheet students know and the dataset a model sees — point at the table and ask which column is the label before they read the bullet points.

# The Hard Part

.pull-left[
### We wrote this rule:

```python
if income &gt; 350000:
    prediction = "Will vote"
else:
    prediction = "Won't vote"
```

### But how do we know it's good?

- Why 350,000? Why not 300,000?
- Should we also use age?
- What about education?
- How do we combine multiple features?
]

--

.pull-right[
### The problem:

**Writing good if-then rules by hand is hard.**

We'd have to:
- Try many different thresholds
- Test many combinations
- Check which rules actually work

.red[
This is exactly what **Machine Learning** automates.
]

*→ Topic of the next module*
]

???

- Let the frustration sink in: ask "if you had 50 features, how many threshold combinations would you need to try manually?" — the answer is astronomically large.
- The punchline lands here: ML is not magic, it is systematic search for the best if-then rules — this reframes ML as something understandable, not mysterious.

*~4 min*

.pull-left-wide[
**Q2.** Your classifier achieves 90% accuracy on your training data but only 55% on new data. What is the most likely cause?

- **A)** The threshold values are set too high — *a tuning problem, easy to fix*
- **B)** The model memorised training patterns that don't generalise to new data — *a learning problem*
- **C)** The new data contains measurement errors — *a data quality problem*
]

--

.pull-left-wide[
.green[**Answer Q2: B** — a large gap between training and test accuracy is the hallmark of *overfitting*: the model learned the training data too specifically and fails on new cases.]
]



???

- Name the phenomenon explicitly: this is called *overfitting* — introduce the term so students recognise it when they encounter it in the next module.
- Ask for a real-world analogy: a student who memorises past exam answers but cannot handle a new question is overfitting — the analogy tends to resonate well.

# Functions: Black Boxes

.pull-left[
&gt; A **function** is a reusable piece of code: give it input, it returns output.

You don't *need* to know *how* it works inside. (Of course it's good to understand, but it's not required to use it.)

]

--

.pull-right[
```
    ┌─────────────┐
    │             │
───&gt;│  FUNCTION   │───&gt;
 Input            Output
    │             │
    └─────────────┘
```

**Example:** `print("Hello")`
- Input: `"Hello"`
- Output: Text appears on screen
]

???

- The black-box metaphor is immediately relatable: we use black boxes all day — a microwave, a GPS, a search engine — we need to know what to put in and what comes out, not the internals.
- Stress that this is a valid and professional way to use tools: even expert programmers use libraries without reading every line of source code.

*~3 min*

---
# Using Functions

.pull-left-wide[
```python
# Built-in functions
text = "Hello World"

length = len(text)        # len() counts characters
print(length)             # Output: 11

number = -42
positive = abs(number)    # abs() gives absolute value
print(positive)           # Output: 42

numbers = [4, 8, 2, 9, 1]
biggest = max(numbers)    # max() finds the maximum
print(biggest)            # Output: 9
```
]

--

.pull-left-wide[
You don't need to know *how* `max()` finds the maximum.

You just need to know: **put in a list → get out the biggest number**
]

???

- Walk through each function and ask students to predict the output before showing it — `abs()` and `max()` are intuitive enough that most will get them right.
- Reinforce the input/output framing for each: `len()` gets a string, returns an integer; `max()` gets a list, returns the largest element — this is the only interface knowledge you need.

*~3 min*

---
# Libraries: Collections of Functions

.pull-left[
&gt; A **library** is a collection of pre-written functions you can import and use.

Instead of writing everything yourself, you **import** what others have built.

```python
# Import a library
import random

# Use a function from that library
dice_roll = random.randint(1, 6)
print(dice_roll)
```
]

.pull-right[
### Common Libraries:

| Library | Used For |
|---------|----------|
| `random` | Random numbers |
| `pandas` | Data tables |
| `matplotlib` | Charts/graphs |
| `scikit-learn` | Machine learning |
| `transformers` | AI/language models |

]

???

- Ask if anyone can guess what `random.randint(1, 6)` does before explaining — the name is descriptive enough that most students will guess correctly, reinforcing the "readable like English" point.
- Mention that `pandas` and `scikit-learn` from the library table will appear in later modules — today's concepts are the foundation they build on.

*~3 min*

---
# Why Libraries Matter

.pull-left[
### Without libraries:
Writing a machine learning model from scratch would take months of expert work.

### With libraries:
```python
from sklearn.linear_model import LinearRegression

model = LinearRegression()
model.fit(X_train, y_train)
predictions = model.predict(X_test)
```

**Four lines of code.**
]

.pull-right[
### The key insight:

You don't need to understand the 10,000 lines of code inside `sklearn`.

You need to understand:
- What goes **in** (training data)
- What comes **out** (predictions)
- When to use it
]

???

- The contrast between "months of expert work" and "four lines" is the core insight — let it land before moving on.
- Emphasise the right panel as the professional competence: knowing *when* to use a tool and being able to validate its output is more valuable than knowing every implementation detail.

*~3 min*

.pull-left-wide[
**Q1.** `len("Hello")` returns 5. What does `len()` receive and return?

- **A)** Input: the memory address of "Hello"; Output: 5 — *computers work at a low level*
- **B)** Input: the string "Hello"; Output: the number of characters — *straightforward input/output*
- **C)** Input: "Hello"; Output: the number of words — *len counts the things inside*
]

--

.pull-left-wide[
.green[**Answer Q1: B** — `len()` counts characters, not words. `"Hello"` has 5 characters. The interface is: string in → integer (character count) out.]
]



???

- Before revealing the answer, ask "how many characters does 'Hello' have?" — count them out loud together if needed: H-e-l-l-o = 5.
- Distractor A (memory address) is a good entry point to name the low-level vs high-level distinction: we work at the interface level, not the hardware level — most professionals never need the low level.

.pull-left-wide[
**Q2.** A colleague runs three lines using a library you've never seen and builds a predictive model. Should you trust the output?

- **A)** Yes — libraries are tested by experts, so results are always reliable — *expert-built = trustworthy*
- **B)** It depends — understand what goes in and out, and validate on known data — *trust but verify*
- **C)** No — only code you understand line-by-line can be trusted — *black boxes are dangerous*
]

--

.pull-left-wide[
.green[**Answer Q2: B** — libraries are reliable tools, but you still need to check that the inputs are correct and the outputs make sense for your specific use case.]
]



???

- This is the most professionally important question of the day — knowing when to trust a tool's output is a critical skill whether you are using Excel, a statistical package, or an AI model.
- Ask for concrete examples of when output validation matters: wrong data format passed to the function, using a model trained on US data to predict Danish outcomes, etc.

*~2 min*

# .red[Practice 3: Classify Citizens (Colab)]

.pull-left[
Open **Practice 3** in the notebook.

**Your task:**
1. Run the starter code and see what it does
2. Change the income threshold to something you think makes sense for Denmark
3. Add a third category: `"Very high income"` for people earning over 800,000 DKK

Then test your classifier on at least three different income values.
]

--

.pull-right[
.green[
**One possible answer:**
```python
if income &lt; 200000:
    category = "Low income"
elif income &lt; 800000:
    category = "High income"
else:
    category = "Very high income"
```
]
]

???

- Let students work in Colab for 5–7 minutes; this is the most hands-on exercise of the session, so give them real time to run and modify code.
- After revealing the answer, ask someone to share their chosen threshold and justify it — there is no single correct answer, and the discussion about *why* a threshold is appropriate is itself a valuable lesson.

# Summary

.pull-left[
### You've learned:

1. **Algorithms** = step-by-step instructions
2. **Python basics**: variables, print, simple math
3. **If-then-else**: making decisions in code
4. **Data structure**: rows, columns, features, labels
5. **Functions &amp; libraries**: black boxes you can use

]

.pull-right[
### Why it matters:

- Machine learning is built on these basics
- Understanding helps you work with technical people
- You can read code even if you don't write it daily
- Informed citizens make better decisions about AI policy

]

???

- Briefly recap each of the five points and ask students which concept was most surprising or counterintuitive — their answers are good formative feedback for you.
- Point forward to the next module (machine learning) and emphasise that today's manual if-then rules are exactly what ML automates — they now have the conceptual foundation to understand what is happening under the hood.
